[project]
name = "aerotwin"
version = "0.1.0"
description = "Single-Pass UAV Video to Georeferenced 3D Model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "torchvision>=0.15",
    "open3d>=0.17",
    "pyproj>=3.6",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "transformers>=4.35",
    "plyfile>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
viewer = [
    "flask>=3.0",
    "flask-cors>=4.0",
]

[project.scripts]
aerotwin = "scripts.run_pipeline:main"

[tool.ruff]
line-length = 100
target-version = "py310"
